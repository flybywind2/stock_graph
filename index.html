    function projectNode3d(node, rootSet, viewport) {
      const x = node.x - viewport.cx;
      const y = node.y - viewport.cy;
      const z = nodeDepth(node, rootSet);
      const yawX = x * viewport.cosYaw - z * viewport.sinYaw;
      const yawZ = x * viewport.sinYaw + z * viewport.cosYaw;
      const pitchY = y * viewport.cosPitch - yawZ * viewport.sinPitch;
      const pitchZ = y * viewport.sinPitch + yawZ * viewport.cosPitch;
      const perspective = viewport.perspective / Math.max(180, viewport.perspective - pitchZ);
      return {
        x: (viewport.cx + yawX * perspective) * scale + offsetX,
        y: (viewport.cy + pitchY * perspective) * scale + offsetY,
        z: pitchZ,
        depthScale: clamp(perspective, 0.56, 1.75)
      };
    }
    function buildProjectionMap(nodes, rootSet) {
      if (!is3dMode) {
        return new Map(nodes.map(node => {
          const [x, y] = transform(node.x, node.y);
          return [node.id, { x, y, z: 0, depthScale: 1 }];
        }));
      }
      const bounds = svg.getBoundingClientRect();
      const viewport = {
        cx: Math.max(bounds.width, 900) / 2,
        cy: Math.max(bounds.height, 650) / 2,
        sinYaw: Math.sin(camera3d.yaw),
        cosYaw: Math.cos(camera3d.yaw),
        sinPitch: Math.sin(camera3d.pitch),
        cosPitch: Math.cos(camera3d.pitch),
        perspective: camera3d.perspective
      };
      return new Map(nodes.map(node => [node.id, projectNode3d(node, rootSet, viewport)]));
    }
    function projectionOpacity(projection) {
      if (!is3dMode) return '1';
      return String(clamp(0.36 + projection.depthScale * 0.42, 0.34, 1));
    }
    function projectedRadius(node, projection) {
      return nodeRadius(node) * (is3dMode ? clamp(projection.depthScale, 0.68, 1.45) : 1);
    }
    function edgeProjectionDepth(edge, projectionMap) {
      const source = projectionMap.get(edge.source);
      const target = projectionMap.get(edge.target);
      return ((source?.z || 0) + (target?.z || 0)) / 2;
    }
    function updateMode3dButton() {
      const mode3dButton = document.getElementById('mode3dButton');
      mode3dButton.setAttribute('aria-pressed', String(is3dMode));
      mode3dButton.title = is3dMode ? '2D 보기로 전환' : '3D 보기로 전환';
      graphEl.classList.toggle('graph-3d', is3dMode);
    }
    function render() {
      const matches = matchingNodes();
      renderResults(matches);
      const roots = rootsFromSearch(matches);
      const rootSet = new Set(roots);
      const visibleIds = trimVisibleNodes(visibleNodeIds(matches));
      const visibleNodes = [...visibleIds].map(id => nodeById.get(id)).filter(Boolean);
      const edgeSelection = prioritizedVisibleEdges(visibleIds, rootSet);
      const visibleEdges = edgeSelection.edges;
      resetLayoutForNewRoots(visibleNodes, roots);
      layoutVisible(visibleNodes, visibleEdges, roots);
      lastVisibleNodes = visibleNodes;
      if (!didInitialFit) {
        fitToNodes(visibleNodes);
        didInitialFit = true;
      }
      svg.replaceChildren();
      const edgeGroup = document.createElementNS(SVG_NS, 'g');
      const nodeGroup = document.createElementNS(SVG_NS, 'g');
      const labelGroup = document.createElementNS(SVG_NS, 'g');
      svg.append(edgeGroup, nodeGroup, labelGroup);
      const projectionMap = buildProjectionMap(visibleNodes, rootSet);
      const edgesForPaint = is3dMode
        ? [...visibleEdges].sort((a, b) => edgeProjectionDepth(a, projectionMap) - edgeProjectionDepth(b, projectionMap))
        : visibleEdges;
      edgesForPaint.forEach(edge => {
        const s = nodeById.get(edge.source), t = nodeById.get(edge.target);
        const sp = projectionMap.get(edge.source), tp = projectionMap.get(edge.target);
        if (!s || !t || !sp || !tp) return;
        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('class', `edge${PEER_EDGE_TYPES.has(edge.type) ? ' peer' : ''}${rootSet.has(edge.source) || rootSet.has(edge.target) ? ' focus' : ''}`);
        line.setAttribute('data-strength', edgeStrength(edge).toFixed(2));
        line.setAttribute('data-depth', edgeProjectionDepth(edge, projectionMap).toFixed(1));
        line.setAttribute('x1', sp.x); line.setAttribute('y1', sp.y); line.setAttribute('x2', tp.x); line.setAttribute('y2', tp.y);
        line.style.strokeWidth = `${edgeStrokeWidth(edge)}px`;
        line.style.opacity = edgeOpacity(edge);
        if (is3dMode) line.style.opacity = String(Number(edgeOpacity(edge)) * Math.min(1, (sp.depthScale + tp.depthScale) / 2));
        edgeGroup.appendChild(line);
      });
      const nodesForPaint = is3dMode
        ? [...visibleNodes].sort((a, b) => (projectionMap.get(a.id)?.z || 0) - (projectionMap.get(b.id)?.z || 0))
        : visibleNodes;
      nodesForPaint.forEach(node => {
        const projection = projectionMap.get(node.id);
        if (!projection) return;
        const circle = document.createElementNS(SVG_NS, 'circle');
        const highlighted = node.id === selectedId || rootSet.has(node.id);
        const r = projectedRadius(node, projection);
        circle.setAttribute('class', `node${highlighted ? ' highlight' : ''}${pinnedPositions.has(node.id) ? ' pinned' : ''}`);
        circle.setAttribute('cx', projection.x); circle.setAttribute('cy', projection.y); circle.setAttribute('r', r);
        circle.setAttribute('data-depth', projection.z.toFixed(1));
        circle.setAttribute('fill', COLORS[node.type] || '#667085');
        circle.style.opacity = projectionOpacity(projection);
        circle.setAttribute('tabindex', '0');
        circle.setAttribute('aria-label', `${node.label} ${LABELS[node.type] || node.type}`);
        const title = document.createElementNS(SVG_NS, 'title');
        title.textContent = `${node.label} · ${LABELS[node.type] || node.type}`;
        circle.appendChild(title);
        circle.addEventListener('pointerdown', event => startNodeDrag(event, node));
        circle.addEventListener('click', () => {
          if (suppressNodeClick === node.id) {
            suppressNodeClick = null;
            return;
          }
          selectNode(node.id);
        });
        circle.addEventListener('dblclick', event => {
          event.stopPropagation();
          selectedId = node.id;
          selectedIds.clear();
          selectedIds.add(node.id);
          if (Number(neighborDepthSelect.value) < 2) neighborDepthSelect.value = '2';
          focusModeSelect.value = 'peer';
          didInitialFit = false;
          render();
        });
        circle.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectNode(node.id);
          }
        });
        nodeGroup.appendChild(circle);
        if (showLabels || highlighted || node.type !== 'stock' || scale >= LABEL_ZOOM_THRESHOLD) {
          const label = document.createElementNS(SVG_NS, 'text');
          label.setAttribute('class', 'label');
          label.setAttribute('x', projection.x + 8); label.setAttribute('y', projection.y + 4);
          label.style.opacity = projectionOpacity(projection);
          label.textContent = node.label;
          labelGroup.appendChild(label);
        }
      });
      const edgeSummary = edgeSelection.candidateCount > visibleEdges.length
        ? `${visibleEdges.length.toLocaleString()} / 후보 ${edgeSelection.candidateCount.toLocaleString()} · 상한 ${edgeSelection.limit.toLocaleString()}`
        : visibleEdges.length.toLocaleString();
      const zAxisSummary = is3dMode ? ` · Z축 ${Z_AXIS_LABELS[zAxisSelect.value]}` : '';
      summary.textContent = `기준일 ${GRAPH_DATA.meta.source_date || ''} · ${is3dMode ? '3D' : '2D'}${zAxisSummary} · 표시 ${visibleNodes.length.toLocaleString()} / 전체 ${GRAPH_DATA.meta.node_count?.toLocaleString?.() || GRAPH_DATA.nodes.length.toLocaleString()} · 렌더 엣지 ${edgeSummary} / 전체 ${GRAPH_DATA.meta.edge_count?.toLocaleString?.() || GRAPH_DATA.edges.length.toLocaleString()}`;
      zoomReadout.textContent = `${Math.round(scale * 100)}%`;
      renderRelationSummary();
      if (roots.length > 1) renderMultiRootDetail(roots);
      else if (roots.length === 1 && nodeById.has(roots[0])) renderDetail(nodeById.get(roots[0]));
      else if (selectedId && nodeById.has(selectedId)) renderDetail(nodeById.get(selectedId));
    }
    function selectNode(id, options = {}) {
      if (!nodeById.has(id)) return;
      const multi = Boolean(options.multi);
      if (multi) {
        if (selectedIds.has(id) && selectedIds.size > 1) selectedIds.delete(id);
        else selectedIds.add(id);
        if (!selectedIds.size) selectedIds.add(id);
        selectedId = selectedIds.has(id) ? id : [...selectedIds][selectedIds.size - 1] || id;
        if (Number(neighborDepthSelect.value) < 2) neighborDepthSelect.value = '2';
        focusModeSelect.value = 'peer';
      } else {
        selectedIds.clear();
        selectedIds.add(id);
        selectedId = id;
      }
      if (focusModeSelect.value === 'overview') focusModeSelect.value = 'focus';
      didInitialFit = false;
      render();
    }
    function startNodeDrag(event, node) {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      const point = screenToGraphPoint(event);
      selectedId = node.id;
      selectedIds.clear();
      selectedIds.add(node.id);
      nodeDrag = {
        id: node.id,
        dx: node.x - point.x,
        dy: node.y - point.y,
        moved: false
      };
      graphEl.classList.add('node-dragging');
    }
    function invalidateLayout() {
      lastRootLayoutKey = '';
      GRAPH_DATA.nodes.forEach(node => {
        if (pinnedPositions.has(node.id)) return;
        delete node.x;
        delete node.y;
      });
      didInitialFit = false;
    }
    function applyGraphPreset(preset) {
      enabledTypes.clear();
      enabledEdges.clear();
      const addTypes = types => types.forEach(type => { if (COLORS[type]) enabledTypes.add(type); });
      const addEdges = types => types.forEach(type => { if (edgeTypes.includes(type)) enabledEdges.add(type); });
      if (preset === 'transaction') {
        addTypes(TRANSACTION_NODE_TYPES);
        addEdges(TRANSACTION_EDGE_TYPES);
      } else if (preset === 'fact') {
        addTypes(FACT_NODE_TYPES);
        addEdges(FACT_EDGE_TYPES);
      } else if (preset === 'propagation') {
        addTypes(PROPAGATION_NODE_TYPES);
        addEdges(PROPAGATION_EDGE_TYPES);
      } else if (preset === 'semantic') {
        addTypes(SEMANTIC_NODE_TYPES);
        addEdges(SEMANTIC_EDGE_TYPES);
      } else if (preset === 'investment') {
        addTypes([...SEMANTIC_NODE_TYPES, ...INVESTMENT_NODE_TYPES]);
        addEdges([...SEMANTIC_EDGE_TYPES, ...INVESTMENT_EDGE_TYPES]);
      } else {
        Object.keys(COLORS).forEach(type => enabledTypes.add(type));
        edgeTypes.forEach(type => enabledEdges.add(type));
      }
      invalidateLayout();
      syncFilterControls();
    }
    function edgeLegendClass(type) {
      return `edge-swatch${PEER_EDGE_TYPES.has(type) ? ' peer' : ''}${type === 'related_stock' || type === 'supply_contract' || type === 'supplies_to' || type === 'related_party_transaction' || type === 'co_moves' || type === 'leads' ? ' focus' : ''}`;
    }
    function syncFilterControls() {
      typeFilters.querySelectorAll('[data-type]').forEach(input => { input.checked = enabledTypes.has(input.dataset.type); });
      edgeTypeFilters.querySelectorAll('[data-edge]').forEach(input => { input.checked = enabledEdges.has(input.dataset.edge); });
      legend.querySelectorAll('[data-legend-type]').forEach(button => {
        button.setAttribute('aria-pressed', enabledTypes.has(button.dataset.legendType) ? 'true' : 'false');
      });
      legend.querySelectorAll('[data-legend-edge]').forEach(button => {
        button.setAttribute('aria-pressed', enabledEdges.has(button.dataset.legendEdge) ? 'true' : 'false');
      });
    }
    function toggleNodeType(type) {
      enabledTypes.has(type) ? enabledTypes.delete(type) : enabledTypes.add(type);
      invalidateLayout();
      syncFilterControls();
      render();
    }
    function toggleEdgeType(type) {
      enabledEdges.has(type) ? enabledEdges.delete(type) : enabledEdges.add(type);
      invalidateLayout();
      syncFilterControls();
      render();
    }
    function createLegendSection(title) {
      const section = document.createElement('div');
      section.className = 'legend-section';
      section.innerHTML = `<div class="legend-title">${escapeHtml(title)}</div><div class="legend-list"></div>`;
      legend.appendChild(section);
      return section.querySelector('.legend-list');
    }
    function setupControls() {
      markets.forEach(market => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" checked data-market="${escapeHtml(market)}"> ${escapeHtml(market)}`;
        label.querySelector('input').addEventListener('change', event => { event.target.checked ? enabledMarkets.add(market) : enabledMarkets.delete(market); invalidateLayout(); render(); });
        marketFilters.appendChild(label);
      });
      const nodeLegend = createLegendSection('노드');
      Object.entries(COLORS).forEach(([type, color]) => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" ${enabledTypes.has(type) ? 'checked' : ''} data-type="${escapeHtml(type)}"> ${escapeHtml(LABELS[type] || type)}`;
        label.querySelector('input').addEventListener('change', event => { event.target.checked ? enabledTypes.add(type) : enabledTypes.delete(type); invalidateLayout(); syncFilterControls(); render(); });
        typeFilters.appendChild(label);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'legend-item';
        button.dataset.legendType = type;
        button.setAttribute('aria-pressed', enabledTypes.has(type) ? 'true' : 'false');
        button.title = `${LABELS[type] || type} 노드 켜기/끄기`;
        button.innerHTML = `<span class="swatch" style="background:${color}"></span><span class="legend-label">${escapeHtml(LABELS[type] || type)}</span>`;
        button.addEventListener('click', () => toggleNodeType(type));
        nodeLegend.appendChild(button);
      });
      const edgeLegend = createLegendSection('엣지');
      edgeTypes.forEach(type => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" ${enabledEdges.has(type) ? 'checked' : ''} data-edge="${escapeHtml(type)}"> ${escapeHtml(EDGE_LABELS[type] || type)}`;
        label.querySelector('input').addEventListener('change', event => { event.target.checked ? enabledEdges.add(type) : enabledEdges.delete(type); invalidateLayout(); syncFilterControls(); render(); });
        edgeTypeFilters.appendChild(label);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'legend-item';
        button.dataset.legendEdge = type;
        button.setAttribute('aria-pressed', enabledEdges.has(type) ? 'true' : 'false');
        button.title = `${EDGE_LABELS[type] || type} 엣지 켜기/끄기`;
        button.innerHTML = `<span class="${edgeLegendClass(type)}"></span><span class="legend-label">${escapeHtml(EDGE_LABELS[type] || type)}</span>`;
        button.addEventListener('click', () => toggleEdgeType(type));
        edgeLegend.appendChild(button);
      });
      syncFilterControls();
      graphPresetSelect.addEventListener('change', () => { applyGraphPreset(graphPresetSelect.value); render(); });
      searchInput.addEventListener('input', requestSearchRender);
      [focusModeSelect, neighborDepthSelect, maxVisibleSelect, edgeRenderLimitSelect, zAxisSelect, minTradeValueSelect, priceMoveSelect].forEach(el => el.addEventListener('input', () => { invalidateLayout(); render(); }));
      [focusModeSelect, neighborDepthSelect, maxVisibleSelect, edgeRenderLimitSelect, zAxisSelect, minTradeValueSelect, priceMoveSelect].forEach(el => el.addEventListener('change', () => { invalidateLayout(); render(); }));
      document.getElementById('labelsButton').addEventListener('click', () => { showLabels = !showLabels; render(); });
      document.getElementById('fitButton').addEventListener('click', () => { fitToNodes(lastVisibleNodes); render(); });
      document.getElementById('unpinButton').addEventListener('click', () => { pinnedPositions.clear(); invalidateLayout(); render(); });
      document.getElementById('zoomInButton').addEventListener('click', () => { zoomAtCenter(1.18); render(); });
      document.getElementById('zoomOutButton').addEventListener('click', () => { zoomAtCenter(1 / 1.18); render(); });
      document.getElementById('mode3dButton').addEventListener('click', () => {
        is3dMode = !is3dMode;
        updateMode3dButton();
        render();
      });
      document.getElementById('resetButton').addEventListener('click', () => {
        window.clearTimeout(searchRenderTimer);
        selectedId = null; selectedIds.clear(); searchInput.value = ''; graphPresetSelect.value = 'transaction'; focusModeSelect.value = 'focus'; neighborDepthSelect.value = '1'; maxVisibleSelect.value = '250'; edgeRenderLimitSelect.value = 'auto'; zAxisSelect.value = 'relationship_strength'; minTradeValueSelect.value = '0'; priceMoveSelect.value = '';
        applyGraphPreset('transaction');
        enabledMarkets.clear(); markets.forEach(market => enabledMarkets.add(market));
        document.querySelectorAll('input[type="checkbox"]').forEach(input => { input.checked = true; });
        syncFilterControls();
        pinnedPositions.clear();
        GRAPH_DATA.nodes.forEach(node => { delete node.x; delete node.y; });
        is3dMode = false; camera3d.yaw = -0.42; camera3d.pitch = 0.52; updateMode3dButton();
        scale = 1; offsetX = 0; offsetY = 0; invalidateLayout(); render();
      });
      svg.addEventListener('wheel', event => {
        event.preventDefault();
        zoomAtClientPoint(event.clientX, event.clientY, event.deltaY > 0 ? 0.9 : 1.1);
        render();
      }, { passive: false });
      graphEl.addEventListener('pointerdown', event => {
        if (event.button !== undefined && event.button !== 0) return;
        if (event.target.closest && event.target.closest('.toolbar, .view-toggle')) return;
        panDrag = { x: event.clientX, y: event.clientY, offsetX, offsetY, yaw: camera3d.yaw, pitch: camera3d.pitch, rotate: is3dMode && !event.shiftKey };
        graphEl.classList.add('dragging');
      });
      window.addEventListener('pointermove', event => {
        if (nodeDrag) {
          const node = nodeById.get(nodeDrag.id);
          if (!node) return;
          const point = screenToGraphPoint(event);
          const next = { x: point.x + nodeDrag.dx, y: point.y + nodeDrag.dy };
          node.x = next.x;
          node.y = next.y;
          pinnedPositions.set(node.id, next);
          nodeDrag.moved = true;
          scheduleRender();
          return;
        }
        if (!panDrag) return;
        if (panDrag.rotate) {
          camera3d.yaw = panDrag.yaw + (event.clientX - panDrag.x) * 0.006;
          camera3d.pitch = clamp(panDrag.pitch + (event.clientY - panDrag.y) * 0.004, -1.1, 1.1);
          scheduleRender();
          return;
        }
        offsetX = panDrag.offsetX + event.clientX - panDrag.x;
        offsetY = panDrag.offsetY + event.clientY - panDrag.y;
        scheduleRender();
      });
      window.addEventListener('pointerup', () => {
        if (nodeDrag) {
          const draggedId = nodeDrag.id;
          const didMove = nodeDrag.moved;
          nodeDrag = null;
          graphEl.classList.remove('node-dragging');
          if (didMove) {
            suppressNodeClick = draggedId;
            setTimeout(() => { if (suppressNodeClick === draggedId) suppressNodeClick = null; }, 0);
          }
          if (!didMove) selectNode(draggedId);
          else render();
        }
        panDrag = null;
        graphEl.classList.remove('dragging');
      });
    }
    setupControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
